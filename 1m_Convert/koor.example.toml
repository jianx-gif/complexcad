# koor.example.toml -- example configuration for the `koor` CLI.
#
# Copy to koor.toml (next to pyproject.toml, or into the working directory, or
# point at it with `koor --config PATH` / $KOOR_CONFIG). Every key can also be
# given as an environment variable (named in the comments); the environment
# wins over the file. Relative paths in this file are resolved relative to it.
#
# NOTE: the thesis scripts never read this file. The CLI forwards a key only
# to a script option that already exists, and only when the key is set here or
# in the environment. `koor config` prints the effective values.

[paths]
# Repository/data root: contains output/, splits/, predictions/ and the
# drawing core modules match.py, make_drawings.py, ...          KOOR_ROOT
root = "E:/3005/data"
# 10 000-model dataset: output/<uuid>/{cadquery.py, metadata.json, ...}   KOOR_OUTPUT_DIR
output_dir = "E:/3005/data/output"
# Train/val/test split lists (test_400.txt, val_100.txt, splits.json)      KOOR_SPLITS_DIR
splits_dir = "E:/3005/data/splits"
# predictions/<method>/<uuid>.py written by the baselines                  KOOR_PREDICTIONS_DIR
predictions_dir = "E:/3005/data/predictions"
# Where eval_precision / eval_predictions / quantization write reports     KOOR_REPORT_DIR
report_dir = "E:/3005/data/1m_Convert/precision_report"
# Test-subset uuid list. When set it is forwarded as --names-file to
# `koor eval-predictions` and `koor adapt-cadrecode` unless the option is
# given on the command line.                                               KOOR_NAMES_FILE
# names_file = "E:/3005/data/predictions/test_subset.txt"

[convert]
# 1M conversion outputs (HPC layout). Forwarded as `koor convert --outdir`
# and `koor recover/peek --dir` when set.      KOOR_CONVERT_OUTDIR / KOOR_CONVERT_TRAIN_DIR
# outdir = "Zero-To-CAD-Baseline/data/koor_1m"
# train_dir = "Zero-To-CAD-Baseline/data/koor_1m/train"

[logging]
# Log level of the CLI layer (the scripts keep their own prints).          KOOR_LOG_LEVEL
level = "INFO"
# Optional log file (appended, UTF-8).                                     KOOR_LOG_FILE
# file = "E:/3005/data/1m_Convert/koor.log"
